<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChordStart | Survey</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    .center-narrow {
      max-width: 760px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">♪</div>
      <span>ChordStart</span>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="chords.html">Chords</a>
      <a href="practice.html">Practice Plan</a>
      <a href="fixes.html">Fixes</a>
      <a href="survey.html">Survey</a>
    </nav>

    <a href="practice.html" class="btn btn-primary header-cta">Start Practice</a>
  </header>

  <main class="container center-narrow">
    <section class="page-head">
      <h1>Quick Survey</h1>
      <p>Help improve the beginner guide.</p>
    </section>

    <form class="form-card" action="https://wp.zybooks.com/form-viewer.php" method="POST">
      <label>
        First and Last Name
        <input type="text" name="fullName" placeholder="Enter your name" />
      </label>

      <label>
        Experience Level
        <input type="text" name="experienceLevel" placeholder="0–1 month, 1–3 months, etc." />
      </label>

      <label>
        Hardest Chord
        <input type="text" name="hardestChord" placeholder="G, C, D, Em, Am..." />
      </label>

      <fieldset class="check-fieldset">
        <legend>Biggest issues</legend>

        <label class="check-row"><input type="checkbox" name="issue" value="buzzing" /> Buzzing strings</label>
        <label class="check-row"><input type="checkbox" name="issue" value="pain" /> Finger pain</label>
        <label class="check-row"><input type="checkbox" name="issue" value="switching" /> Slow chord switching</label>
        <label class="check-row"><input type="checkbox" name="issue" value="placement" /> Finger placement</label>
        <label class="check-row"><input type="checkbox" name="issue" value="rhythm" /> Strumming rhythm</label>
      </fieldset>

      <label>
        Additional Comments
        <textarea name="comments" placeholder="Share your thoughts, suggestions, or challenges..."></textarea>
      </label>

      <button class="btn btn-primary btn-wide" type="submit">Submit Survey</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 ChordStart. All rights reserved.</p>
    <div class="footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </div>
  </footer>
</body>
</html>
